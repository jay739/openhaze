name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with swiftc
        run: |
          cd macos
          ./build.sh
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build with the built-in csc.exe
        shell: cmd
        run: |
          cd windows
          build.bat --no-launch
      - name: Install Inno Setup
        shell: cmd
        run: choco install innosetup --no-progress -y
      - name: Build installer (dry run, not published)
        working-directory: windows
        shell: cmd
        run: "\"C:\\Program Files (x86)\\Inno Setup 6\\ISCC.exe\" /DOPENHAZE_VERSION=0.0.0-ci installer.iss"
